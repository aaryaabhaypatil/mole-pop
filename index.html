<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
    <title>Whack a Mole</title>
  </head>
  <body>

    <!-- Hammer cursor -->
    <div id="cursor"></div>

    <!-- Level-up banner -->
    <div id="level-banner"></div>

    <!-- Left panel: exit/controls -->
    <div id="left-panel">
      <!-- Squidly exit button renders here via access-button -->
    </div>

    <!-- Right panel -->
    <div id="right-panel">

      <!-- Top 25vh: HUD -->
      <div id="hud">
        <div class="hud-box">
          <div class="hud-label">Score</div>
          <div class="hud-val" id="score-el">00</div>
        </div>
        <div class="hud-box level-box">
          <div class="hud-label">Level</div>
          <div class="hud-val level-badge" id="level-el">Level 1</div>
        </div>
        <div class="hud-box">
          <div class="hud-label">Time</div>
          <div class="hud-val" id="time-el">30s</div>
        </div>

        <!-- Progress sits inside HUD at the bottom -->
        <div id="progress-row">
          <p id="progress-label"></p>
          <div id="progress-bar-wrap">
            <div id="progress-bar"></div>
          </div>
        </div>
      </div>

      <!-- Bottom 75vh: Game board -->
      <div id="board"></div>

    </div>

    <!-- Start / Game-over overlay -->
    <div id="overlay-bg" style="display:none;"></div>
    <div id="overlay">
       <div id="overlay-content">
          <h2>Whack-a-Mole!</h2>
          <p>Hit moles to score. Level up by hitting enough — more holes appear as you improve!</p>
       </div>
      
    </div>

  </body>
</html>
