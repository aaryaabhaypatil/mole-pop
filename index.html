<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
    <title>Whack a Mole</title>
  </head>
  <body>

    <!-- Hammer cursor -->
    <div id="cursor"></div>

    <!-- Level-up banner -->
    <div id="level-banner"></div>

    <!-- HUD -->
    <div id="hud">
      <div class="hud-box">
        <div class="hud-label">Score</div>
        <div class="hud-val" id="score-el">00</div>
      </div>
      <span class="level-badge" id="level-el">Level 1</span>
      <div class="hud-box">
        <div class="hud-label">Time</div>
        <div class="hud-val" id="time-el">30s</div>
      </div>
    </div>

    <!-- Progress bar -->
    <p id="progress-label">hits to next level</p>
    <div id="progress-bar-wrap">
      <div id="progress-bar"></div>
    </div>

    <!-- Game board (holes injected by JS) -->
    <div id="board"></div>

    <!-- Start / Game-over overlay -->
    <div id="overlay">
      <h2>Whack-a-Mole!</h2>
      <p>Hit moles to score. Level up by hitting enough — more holes appear as you improve!</p>
      <button class="btn gold" id="start-btn">Start Game</button>
    </div>

  </body>
</html>
